# espanso match file



# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.
matches:
  - trigger: ":tace"
    replace: "தமிழ் நேரம்!"

  - trigger: ":br"
    replace: "அன்புடன்,\nதமிழ் நேரம்"

  - trigger: ":now"
    replace: "மணி {{mytime}}"
    vars:
      - name: mytime
        type: date
        params:
          format: "%H:%M"
